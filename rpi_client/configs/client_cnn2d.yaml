# =============================================================
# configs/client_cnn2d.yaml — FedKD-MR RPi  (CNN2D)
# =============================================================
# CNN2D interpreta cada janela como imagem 2D:
#   imagem: H=t_window (8) × W=n_features (12) = 8×12
# cnn2d_h e cnn2d_w podem ser omitidos (usa t_window e n_features).
# =============================================================
# Uso:
#   python fedkd_client.py --config configs/client_cnn2d.yaml
# =============================================================

# ── Identificação ─────────────────────────────────────────────
client_id: 7
model: cnn2d

# ── Dataset ───────────────────────────────────────────────────
data_dir:   data/
train_file: dataset_priv.bin
pub_file:   dataset_pub.bin
meta_file:  metadata.json

# ── Janela temporal ───────────────────────────────────────────
t_window:   8
n_features: 12
n_classes:  4

# ── Shape CNN2D (opcional — default: t_window × n_features) ───
# cnn2d_h: 8    # descomente para sobrescrever
# cnn2d_w: 12

# ── Hiperparâmetros — treino local ────────────────────────────
local_epochs: 50
local_lr:     0.001

# ── Hiperparâmetros — Knowledge Distillation ──────────────────
kd_epochs:      20
kd_lr:          0.0005
kd_temperature: 1.0

# ── Hiperparâmetros — Fine-tuning ─────────────────────────────
ft_epochs: 10
ft_lr:     0.0005

# ── Batching ──────────────────────────────────────────────────
batch_size: 32

# ── Arquitetura CNN2D ─────────────────────────────────────────
# Kernel 3×3; padding preserva dimensões espaciais
cnn_channels: [32, 64, 128]
cnn_kernel:   3
cnn_dropout:  0.3

# ── MQTT ──────────────────────────────────────────────────────
broker:          "192.168.0.12"
port:            1883
keepalive:       300
teacher_timeout: 300

# ── Runtime ───────────────────────────────────────────────────
device: cpu
seed:   42
