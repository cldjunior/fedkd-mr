; =============================================================
; platformio.ini — FedKD-MR  (3 clientes heterogêneos)
; =============================================================
; Para compilar e gravar:
;   pio run -e mlp   --target upload
;   pio run -e cnn1d --target upload
;   pio run -e gru   --target upload
;
; No VS Code: aba PlatformIO → escolha o ambiente no rodapé
; =============================================================

[platformio]
default_envs = mlp

; ── Configurações comuns a todos os ambientes ─────────────────
[env]
platform  = espressif32
board     = esp32dev               ; ESP32 padrão (WROOM, WROVER, DevKit)
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/GiorgosXou/NeuralNetworks   ; NeuralNetwork.h
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

board_build.filesystem = littlefs

; Flags comuns: WiFi, MQTT broker, hiperparâmetros default
; Sobrescreva por ambiente se precisar de valores diferentes
build_flags =
    -D ENABLE_MQTT
    -D WIFI_SSID=\"CLARO_8EF8BC\"
    -D WIFI_PASSWORD=\"h7yhAHN#YT\"
    -D MQTT_BROKER=\"192.168.0.12\"
    -D MQTT_PORT=1883
    -D LOCAL_EPOCHS=30
    -D LOCAL_LR_WEIGHTS=0.003f
    -D LOCAL_LR_BIASES=0.003f
    -D KD_EPOCHS=10
    -D KD_LR_WEIGHTS=0.001f
    -D KD_LR_BIASES=0.001f
    -D FT_EPOCHS=5
    -D FT_LR_WEIGHTS=0.001f
    -D FT_LR_BIASES=0.001f
    -D WDT_TIMEOUT_SEC=120
    -D MQTT_KEEPALIVE=60

; ── Cliente 1: MLP ───────────────────────────────────────────
[env:mlp]
build_flags =
    ${env.build_flags}
    -D CLIENT_ID=1

; ── Cliente 2: CNN1D ─────────────────────────────────────────
[env:cnn1d]
build_flags =
    ${env.build_flags}
    -D CLIENT_ID=2

; ── Cliente 3: GRU ───────────────────────────────────────────
[env:gru]
build_flags =
    ${env.build_flags}
    -D CLIENT_ID=3
    -D MQTT_KEEPALIVE=1800