; =============================================================
; platformio.ini — FedKD-MR  (3 clientes heterogêneos)
; =============================================================
; Para compilar e gravar:
;   pio run -e mlp   --target upload
;   pio run -e cnn1d --target upload
;   pio run -e gru   --target upload
;
; Para COLETA DE DADOS (antes da federação):
;   pio run -e collector --target uploadfs   # só na 1ª vez (formata LittleFS)
;   pio run -e collector --target upload
;   pio device monitor -e collector
;
; No VS Code: aba PlatformIO → escolha o ambiente no rodapé
; =============================================================

[platformio]
default_envs = mlp

; ── Configurações comuns a todos os ambientes ─────────────────
[env]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/GiorgosXou/NeuralNetworks
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

board_build.filesystem = littlefs

build_src_filter =
    +<*>
    -<main_collector.cpp>

build_flags =
    -D ENABLE_MQTT
    -D WIFI_SSID=\"CLARO_8EF8BC\"
    -D WIFI_PASSWORD=\"h7yhAHN#YT\"
    -D MQTT_BROKER=\"192.168.0.14\"
    -D MQTT_PORT=1883
    -D LOCAL_EPOCHS=30
    -D LOCAL_LR_WEIGHTS=0.003f
    -D LOCAL_LR_BIASES=0.003f
    -D KD_EPOCHS=10
    -D KD_LR_WEIGHTS=0.001f
    -D KD_LR_BIASES=0.001f
    -D FT_EPOCHS=5
    -D FT_LR_WEIGHTS=0.001f
    -D FT_LR_BIASES=0.001f
    -D WDT_TIMEOUT_SEC=120
    -D MQTT_KEEPALIVE=60

; ── Cliente 1: MLP ───────────────────────────────────────────
[env:mlp]
upload_port = /dev/ttyUSB1
build_flags =
    ${env.build_flags}
    -D CLIENT_ID=1

; ── Cliente 2: CNN1D ─────────────────────────────────────────
[env:cnn1d]
upload_port = /dev/ttyUSB2
build_flags =
    ${env.build_flags}
    -D CLIENT_ID=2

; ── Cliente 3: GRU ───────────────────────────────────────────
[env:gru]
upload_port = /dev/ttyUSB3
build_flags =
    ${env.build_flags}
    -D CLIENT_ID=3
    -D MQTT_KEEPALIVE=1800

; ── Coleta de dados reais (HLK-LD2410C) ──────────────────────
[env:collector]
upload_speed  = 921600

build_src_filter =
    -<*>
    +<LD2410C.cpp>
    +<main_collector.cpp>

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

board_build.filesystem = littlefs

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM=0
